plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.10.5'
}

group = 'com.binzaru'
version = '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'

    intellijPlatform {
        intellijIdeaCommunity('2024.3.2.1')
        instrumentationTools()
        pluginVerifier()
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks {
    // Отключаем IntelliJ sandbox
    prepareTestSandbox { enabled = false }
    prepareTest { enabled = false }
    instrumentTestCode { enabled = false }

    // Быстрые тесты - без IntelliJ Platform в classpath
    // Исключаем тесты с тегом 'intellij-platform' (которым нужны классы IntelliJ)
    test {
        useJUnitPlatform {
            excludeTags 'intellij-platform'
        }
        dependsOn -= prepareTest
        classpath = sourceSets.test.runtimeClasspath

        // Полностью изолируем от IntelliJ Platform (несовместимы с Java 21)
        jvmArgumentProviders.clear()
        systemProperties.clear()
        jvmArgs = []
    }
}

// Тесты, которым нужны классы IntelliJ Platform в classpath
// Запуск: ./gradlew platformTest
tasks.register('platformTest', Test) {
    useJUnitPlatform {
        includeTags 'intellij-platform'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + configurations.intellijPlatformClasspath
}