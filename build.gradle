plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.2.1'
}

group = 'com.binzaru'
version = '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'

    intellijPlatform {
        intellijIdeaCommunity('2024.3.2.1')
        instrumentationTools()
        pluginVerifier()
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks {
    test {
        useJUnitPlatform()
    }

    // Отключаем IntelliJ sandbox для unit тестов
    // Это убирает warnings и ускоряет запуск с ~2 минут до нескольких секунд
    prepareTestSandbox { enabled = false }
    prepareTest { enabled = false }
    instrumentTestCode { enabled = false }

    // Убираем зависимость test task от IntelliJ Platform tasks
    test {
        dependsOn -= prepareTest
        classpath = sourceSets.test.runtimeClasspath
    }
}